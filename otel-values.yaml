# Deploy as a single-replica Deployment instead of a DaemonSet so it doesn't run on every node
mode: deployment
replicaCount: 1

# Use the slim core collector image rather than otelcol-contrib to save disk/tmpfs and RAM
image:
  repository: otel/opentelemetry-collector

# Disable heavy built-in presets so we don't duplicate node metrics/logs or add extra pods
presets:
  logsCollection:
    enabled: false
  hostMetrics:
    enabled: false
  kubeletMetrics:
    enabled: false
  clusterMetrics:
    enabled: false
  kubernetesEvents:
    enabled: false
  kubernetesAttributes:
    enabled: false

# Keep CPU and memory small so the pod stays lightweight on your K3d cluster
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Collector pipeline: receive OTLP -> protect memory & batch -> export logs to Loki + debug
config:
  receivers:
    otlp:
      protocols:
        # Listen for OpenTelemetry gRPC traffic on port 4317
        grpc:
          endpoint: 0.0.0.0:4317
        # Listen for OpenTelemetry HTTP traffic on port 4318
        http:
          endpoint: 0.0.0.0:4318

  processors:
    # Drop/backpressure telemetry before the container hits its memory limit
    memory_limiter:
      check_interval: 1s
      limit_mib: 96
      spike_limit_mib: 24
    # Group telemetry into batches to reduce network/CPU overhead
    batch:
      timeout: 5s
      send_batch_size: 512

  exporters:
    # Print incoming telemetry summaries to pod stdout for easy lab inspection
    debug:
      verbosity: basic
    # Send OTLP logs directly to Loki's native OTLP HTTP endpoint (bypasses gateway)
    otlphttp/loki:
      endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp
      tls:
        insecure: true

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/loki, debug]
